events {}

http {
  access_log off;
  server_tokens off;

  # Round-robin entre as 3 instâncias. Nenhuma afinidade é necessária:
  # todas as garantias de concorrência estão no PostgreSQL.
  upstream app {
    server app-1:3000 max_fails=2 fail_timeout=5s;
    server app-2:3000 max_fails=2 fail_timeout=5s;
    server app-3:3000 max_fails=2 fail_timeout=5s;
    keepalive 32;
  }

  server {
    listen 80;
    client_max_body_size 16k;

    location / {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Retentar em outra instância só é seguro porque POST /wagering/transactions é idempotente.
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
    }
  }
}
