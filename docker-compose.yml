name: processador-de-apostas

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wagering}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wagering}
      POSTGRES_DB: ${POSTGRES_DB:-wagering}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Emulador SQS. A imagem é parametrizável para permitir trocar
  # LocalStack por MiniStack sem alterar o restante do compose.
  sqs:
    image: ${SQS_EMULATOR_IMAGE:-localstack/localstack:4.4}
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "${SQS_PORT:-4566}:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Provisiona as filas de forma idempotente via AWS CLI, independente do emulador.
  sqs-init:
    image: amazon/aws-cli:2.27.0
    depends_on:
      sqs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      SQS_ENDPOINT: http://sqs:4566
      SQS_MAX_RECEIVE_COUNT: ${SQS_MAX_RECEIVE_COUNT:-5}
    entrypoint: ["/bin/sh", "/scripts/create-queues.sh"]
    volumes:
      - ./infra/sqs:/scripts:ro

volumes:
  postgres-data:
